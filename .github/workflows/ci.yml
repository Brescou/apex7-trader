name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}
      - name: Run linter (ruff)
        run: uv run ruff check . --select E,F,W --ignore E501
      - name: Run tests
        env:
          SIMULATION_MODE: "true"
          PORTFOLIO_SAVE_ENABLED: "false"
          USE_LIVEFEED: "false"
        run: |
          uv run pytest tests/ -v --tb=short \
            --cov=. --cov-report=xml --cov-report=html --cov-fail-under=60
      - name: Upload coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install dependencies
        run: uv sync
      - name: Check formatting (black)
        run: uv run black --check --diff .
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install dependencies
        run: uv sync
      # flake8-bandit security scan. The three ignored rules cover intentional
      # patterns in this repo: S110 (fail-silent try/except/pass for Discord and
      # yfinance), S311 (non-crypto random for the price simulation/slippage),
      # and S104 (binding 0.0.0.0 for the containerized FastAPI backend). This still
      # catches new issues like hardcoded secrets or SQL injection.
      - name: Security scan (ruff flake8-bandit)
        run: uv run ruff check . --select S --ignore S110,S311,S104 --exclude tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
