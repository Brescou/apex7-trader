name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Run linter (ruff)
        run: uv run ruff check core/ tests/ market_data.py --select E,F,W --ignore E501
      - name: Run smoke tests
        env:
          SIMULATION_MODE: "true"
          ANTHROPIC_API_KEY: "sk-dummy-for-ci"
        run: uv run python tests/test_smoke.py
      - name: Run terminal tests
        env:
          SIMULATION_MODE: "true"
        run: uv run python tests/test_terminal.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Check formatting (black)
        run: uv run black --check --diff core/ tests/ market_data.py
