name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-path: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Run linter (ruff)
        run: uv run ruff check . --select E,F,W --ignore E501
      - name: Run tests
        env:
          SIMULATION_MODE: "true"
          PORTFOLIO_SAVE_ENABLED: "false"
          USE_LIVEFEED: "false"
        run: uv run pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-fail-under=52
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-path: uv.lock
      - name: Install dependencies
        run: uv sync
      - name: Check formatting (black)
        run: uv run black --check --diff .
