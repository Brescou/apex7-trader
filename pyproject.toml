[project]
name = "apex7-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0",
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.4",
    "langchain-anthropic>=1.3.4",
    "langgraph>=1.0.10",
    "langgraph-cli[inmem]>=0.4.14",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "python-dotenv>=1.2.2",
    "tweepy>=4.16.0",
    "yahooquery>=2.4.1",
    "yfinance>=1.2.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]
# Legacy files excluded — reformatting would pollute git history
exclude = '''
/(
    agent\.py
  | agent_multi\.py
  | data\.py
  | backtest\.py
  | app\.py
  | graph_registry\.py
  | leaderboard\.py
  | config\.py
  | main\.py
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy files excluded — lint-clean incrementally
exclude = [
    "agent.py", "agent_multi.py", "data.py", "backtest.py",
    "app.py", "graph_registry.py", "leaderboard.py", "config.py", "main.py",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
