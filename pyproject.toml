[project]
name = "apex7-trader"
version = "0.1.0"
description = "Multi-agent LLM trading dashboard built with LangGraph, Dash, and Claude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0",
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-mantine-components>=2.0.0",
    "fastapi>=0.138.1",
    "httpx>=0.28.1",
    "langgraph>=1.0.10",
    "langgraph-cli[inmem]>=0.4.14",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "tweepy>=4.16.0",
    "uvicorn[standard]>=0.41.0",
    "yfinance>=1.2.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"agents/shared/nodes.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
# CI's `--cov=.` measures the whole repo — without this, near-100%-covered
# test files themselves count toward the numerator and denominator,
# inflating the reported percentage well above the real application
# coverage (Review Finding: 80% reported vs. 67% actual application code
# coverage). Excluding tests/ makes --cov-fail-under=60 check the number
# it's meant to check.
omit = ["tests/*"]
